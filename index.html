<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b5261e">
<title>蘋果雞 · 叫貨</title>
<style>
  :root {
    --red: #b5261e;
    --red-dark: #8e1c16;
    --cream: #f6e7b0;
    --cream-light: #fbf4d8;
    --black: #1a1a1a;
    --gray: #666;
    --border: #e5d9a8;
    --bg: #faf7eb;
    --white: #fff;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--black);
    min-height: 100%;
    font-size: 16px;
  }
  body { padding-bottom: calc(100px + var(--safe-bottom)); }

  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: var(--red);
    color: #fff;
    padding: 14px 14px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: .04em; line-height: 1.2; }
  .brand .sub { font-size: 14px; opacity: .9; }
  .top-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-ghost {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.35);
    color: #fff;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-ghost.active { background: var(--cream); color: var(--red); border-color: var(--cream); }

  .mode-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 10px 8px;
    position: sticky; top: 62px; z-index: 35;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .mode-label {
    font-size: 13px; color: var(--gray); font-weight: 600;
    margin-bottom: 6px; padding-left: 4px;
  }
  .mode-switch {
    display: flex; gap: 6px;
  }
  .mode-btn {
    flex: 1;
    border: 2px solid var(--border);
    background: var(--cream-light);
    color: var(--black);
    border-radius: 10px;
    padding: 10px 6px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    line-height: 1.2;
  }
  .mode-btn.active {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }

  .banner {
    background: var(--cream);
    color: var(--red-dark);
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .banner.hidden { display: none; }

  .section { margin: 14px 10px; background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .section-head {
    background: var(--black);
    color: var(--cream);
    padding: 12px 14px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .08em;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-head .count {
    background: var(--red);
    color: #fff;
    font-size: 14px;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
  }
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 12px;
    border-bottom: 1px solid #f0ead0;
    min-height: 64px;
  }
  .item:last-child { border-bottom: none; }
  .item.has-qty { background: #fff8e6; }
  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.3;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .item-meta {
    font-size: 15px;
    color: var(--gray);
    margin-top: 4px;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .tag {
    display: inline-block;
    background: var(--cream-light);
    color: var(--red-dark);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .tag.tappable:active { opacity: .75; }
  .tag.has-override { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
  .tag.vendor-未指定 { background: #eee; color: #888; }
  .tag.vendor-菜商 { background: #e8f5e9; color: #2e7d32; }
  .tag.vendor-原廠 { background: #e3f2fd; color: #1565c0; }
  .tag.vendor-櫳樺商行 { background: #fff3e0; color: #e65100; }
  .tag.vendor-翊品行 { background: #f3e5f5; color: #6a1b9a; }
  .price { font-weight: 600; color: var(--black); font-size: 15px; }
  .only-one {
    font-size: 12px; color: #e65100; font-weight: 700;
    background: #fff3e0; border-radius: 4px; padding: 1px 6px;
  }

  .qty-ctrl { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .qty-btn {
    width: 48px; height: 48px;
    border-radius: 12px;
    border: none;
    font-size: 26px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .qty-btn.minus { background: #f0ead0; color: var(--black); }
  .qty-btn.plus { background: var(--red); color: #fff; }
  .qty-btn:active { opacity: .75; transform: scale(.96); }
  .qty-btn:disabled { opacity: .35; cursor: default; }
  .qty-val {
    min-width: 40px;
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    color: var(--red);
    line-height: 1.1;
  }
  .qty-val.zero { color: #bbb; font-weight: 600; }
  .unit-label { font-size: 13px; color: var(--gray); text-align: center; margin-top: 0; }

  .settings-row {
    display: none;
    width: 100%;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  body.settings-on .settings-row { display: flex; }
  body.settings-on .qty-ctrl { display: none; }
  .settings-row select, .settings-row input {
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
  }
  .settings-row select { flex: 1; min-width: 100px; }
  .settings-row input.price-input { width: 80px; }
  .btn-del {
    background: #ffebee; color: #c62828; border: none;
    border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .add-item-row {
    display: none;
    padding: 12px;
    background: var(--cream-light);
    gap: 6px; flex-wrap: wrap; align-items: center;
  }
  body.settings-on .add-item-row { display: flex; }
  .add-item-row input, .add-item-row select {
    font-size: 15px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff;
  }
  .add-item-row input.name { flex: 1; min-width: 100px; }
  .add-item-row input.price { width: 80px; }
  .btn-add {
    background: var(--red); color: #fff; border: none;
    border-radius: 8px; padding: 10px 14px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .settings-bar {
    display: none;
    margin: 12px 10px;
    padding: 14px;
    background: #fff;
    border-radius: 12px;
    border: 2px dashed var(--red);
    text-align: center;
  }
  body.settings-on .settings-bar { display: block; }
  .btn-reset-defaults {
    background: #fff; color: var(--red); border: 2px solid var(--red);
    border-radius: 999px; padding: 12px 20px; font-size: 16px; font-weight: 700; cursor: pointer;
  }

  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 12px 14px calc(12px + var(--safe-bottom));
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 -4px 16px rgba(0,0,0,.08);
  }
  .bottom-summary { flex: 1; min-width: 0; }
  .bottom-summary .label { font-size: 14px; color: var(--gray); }
  .bottom-summary .value { font-size: 20px; font-weight: 800; color: var(--red); line-height: 1.2; word-break: break-word; }
  .btn-settle {
    background: var(--red); color: #fff; border: none;
    border-radius: 12px; padding: 16px 22px;
    font-size: 18px; font-weight: 800; cursor: pointer;
    letter-spacing: .06em;
    flex-shrink: 0;
  }
  .btn-settle:disabled { background: #ccc; cursor: default; }
  .btn-clear {
    background: #f5f5f5; color: var(--gray); border: none;
    border-radius: 12px; padding: 16px 12px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    flex-shrink: 0;
  }

  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.72);
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    width: 100%; max-width: 520px;
    max-height: 92vh;
    border-radius: 18px 18px 0 0;
    overflow: hidden;
    display: flex; flex-direction: column;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head {
    background: var(--red); color: #fff;
    padding: 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-head h2 { font-size: 22px; font-weight: 800; }
  .modal-close {
    background: rgba(255,255,255,.2); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer;
  }
  .modal-body { overflow-y: auto; padding: 14px 12px 28px; flex: 1; }
  .grand-total {
    background: var(--cream);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
  }
  .grand-total .g-label { font-size: 16px; font-weight: 700; color: var(--red-dark); }
  .grand-total .g-value { font-size: 26px; font-weight: 900; color: var(--red); }

  .settle-mode-wrap {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .settle-mode-wrap .mode-label { margin-bottom: 8px; }

  .vendor-card {
    background: #fff; border-radius: 12px; margin-bottom: 14px;
    overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .vendor-head {
    background: var(--black); color: var(--cream);
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .vendor-head h3 { font-size: 18px; font-weight: 800; }
  .btn-copy {
    background: var(--cream); color: var(--red-dark); border: none;
    border-radius: 8px; padding: 8px 14px; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .btn-copy.copied { background: #c8e6c9; color: #2e7d32; }
  .vendor-hint {
    background: #fff3e0; color: #e65100;
    padding: 10px 14px; font-size: 14px; font-weight: 600;
  }
  .vendor-line {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid #f0ead0;
    font-size: 16px;
  }
  .vendor-line:last-of-type { border-bottom: none; }
  .vendor-line .l-name {
    font-weight: 700; flex: 1; min-width: 0;
    word-break: break-word; overflow-wrap: anywhere; line-height: 1.3;
  }
  .vendor-line .l-qty { color: var(--red); font-weight: 800; min-width: 44px; text-align: right; font-size: 17px; }
  .vendor-line .l-price { color: var(--gray); font-size: 14px; min-width: 60px; text-align: right; }
  .vendor-line .l-sub { font-weight: 700; min-width: 70px; text-align: right; font-size: 16px; }
  .vendor-total {
    background: var(--cream-light);
    padding: 12px 14px;
    display: flex; justify-content: space-between;
    font-weight: 800; font-size: 18px;
  }
  .empty-hint { text-align: center; padding: 40px 20px; color: var(--gray); font-size: 16px; }

  .picker-overlay {
    display: none; position: fixed; inset: 0; z-index: 120;
    background: rgba(0,0,0,.45);
    align-items: flex-end; justify-content: center;
  }
  .picker-overlay.open { display: flex; }
  .picker {
    background: #fff;
    width: 100%; max-width: 520px;
    border-radius: 18px 18px 0 0;
    padding: 8px 0 calc(16px + var(--safe-bottom));
    animation: slideUp .2s ease;
  }
  .picker-title {
    font-size: 18px; font-weight: 800; padding: 14px 18px 8px;
    color: var(--black);
  }
  .picker-sub {
    font-size: 14px; color: var(--gray); padding: 0 18px 10px;
  }
  .picker-opt {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; border: none; background: #fff;
    padding: 16px 18px; font-size: 18px; font-weight: 700;
    cursor: pointer; border-top: 1px solid #f0ead0;
    text-align: left; color: var(--black);
  }
  .picker-opt:active { background: var(--cream-light); }
  .picker-opt.selected { background: #fff8e6; color: var(--red); }
  .picker-opt .p-price { font-size: 16px; color: var(--gray); font-weight: 600; }
  .picker-opt.follow { color: var(--red-dark); }
  .picker-cancel {
    margin: 10px 14px 0;
    width: calc(100% - 28px);
    border: none; background: #f5f5f5; color: var(--gray);
    border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 700; cursor: pointer;
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(110px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,.85); color: #fff;
    padding: 12px 20px; border-radius: 999px;
    font-size: 16px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: .25s; z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 520px) {
    .modal-overlay, .picker-overlay { align-items: center; }
    .modal { border-radius: 18px; max-height: 85vh; }
    .picker { border-radius: 18px; }
    .mode-bar { top: 70px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <h1>🍎 蘋果雞 · 叫貨</h1>
        <div class="sub">台南永康店</div>
      </div>
      <div class="top-actions">
        <button type="button" class="btn-ghost" id="btnSettings" onclick="toggleSettings()">設定</button>
      </div>
    </div>
  </header>

  <div class="mode-bar" id="modeBar">
    <div class="mode-label">叫貨模式（點廠商標籤可單獨指定）</div>
    <div class="mode-switch" id="modeSwitch">
      <button type="button" class="mode-btn" data-mode="cheapest" onclick="setMode('cheapest')">最便宜</button>
      <button type="button" class="mode-btn" data-mode="second" onclick="setMode('second')">次便宜</button>
    </div>
  </div>

  <div class="banner hidden" id="settingsBanner">設定模式：可改預設廠商、單價、新增或刪除品項</div>

  <div id="listRoot"></div>

  <div class="settings-bar">
    <button type="button" class="btn-reset-defaults" onclick="resetDefaults()">恢復預設品項與廠商</button>
  </div>

  <div class="bottom-bar">
    <button type="button" class="btn-clear" onclick="clearAll()">全部清除</button>
    <div class="bottom-summary">
      <div class="label">已選品項</div>
      <div class="value" id="totalCount">0 項 · 0 包</div>
    </div>
    <button type="button" class="btn-settle" id="btnSettle" onclick="openSettle()" disabled>結算</button>
  </div>

  <div class="modal-overlay" id="settleModal" onclick="backdropClose(event)">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>叫貨結算</h2>
        <button type="button" class="modal-close" onclick="closeSettle()" aria-label="關閉">×</button>
      </div>
      <div class="modal-body" id="settleBody"></div>
    </div>
  </div>

  <div class="picker-overlay" id="pickerOverlay" onclick="pickerBackdrop(event)">
    <div class="picker" id="pickerSheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>

  var STORAGE_ITEMS = 'applechicken_items_v3';
  var STORAGE_ITEMS_OLD = 'applechicken_items_v2';
  var STORAGE_QTY = 'applechicken_qty_v1';
  var STORAGE_MODE = 'applechicken_mode_v1';
  var STORAGE_OVERRIDES = 'applechicken_overrides_v2';

  var items = [];
  var qty = {};
  var mode = 'cheapest'; // cheapest | second
  var overrides = {}; // id -> vendor name
  var settingsOn = false;
  var pickerItemId = null;

  function deepClone(arr) {
    return JSON.parse(JSON.stringify(arr));
  }

  function hasPrices(it) {
    return it && it.prices && typeof it.prices === 'object' && Object.keys(it.prices).length > 0;
  }

  function priceEntries(it) {
    if (!hasPrices(it)) return [];
    var list = [];
    PRICE_VENDOR_ORDER.forEach(function (v) {
      if (it.prices[v] != null && !isNaN(it.prices[v])) {
        list.push({ vendor: v, price: Number(it.prices[v]) });
      }
    });
    return list;
  }

  function sortedByPrice(it) {
    var list = priceEntries(it).slice();
    list.sort(function (a, b) {
      if (a.price !== b.price) return a.price - b.price;
      return PRICE_VENDOR_ORDER.indexOf(a.vendor) - PRICE_VENDOR_ORDER.indexOf(b.vendor);
    });
    return list;
  }

  function resolveVendor(it) {
    // returns { vendor, price, onlyOne, overridden }
    if (!it) return { vendor: '未指定', price: null, onlyOne: false, overridden: false };

    if (overrides[it.id]) {
      var ov = overrides[it.id];
      var ovPrice = null;
      if (hasPrices(it) && it.prices[ov] != null) ovPrice = Number(it.prices[ov]);
      else if (ov === it.vendor) ovPrice = it.price;
      return { vendor: ov, price: ovPrice, onlyOne: false, overridden: true };
    }

    if (!hasPrices(it)) {
      return { vendor: it.vendor || '未指定', price: it.price != null ? it.price : null, onlyOne: false, overridden: false };
    }

    var ranked = sortedByPrice(it);
    if (!ranked.length) {
      return { vendor: it.vendor || '未指定', price: it.price != null ? it.price : null, onlyOne: false, overridden: false };
    }

    if (mode !== 'second') {
      return { vendor: ranked[0].vendor, price: ranked[0].price, onlyOne: ranked.length === 1, overridden: false };
    }

    // second
    if (ranked.length === 1) {
      return { vendor: ranked[0].vendor, price: ranked[0].price, onlyOne: true, overridden: false };
    }
    var lowest = ranked[0].price;
    var tied = ranked.filter(function (x) { return x.price === lowest; });
    if (tied.length >= 2) {
      // second cheapest among ties: the second in tie-break order
      return { vendor: tied[1].vendor, price: tied[1].price, onlyOne: false, overridden: false };
    }
    // unique lowest -> next price tier
    return { vendor: ranked[1].vendor, price: ranked[1].price, onlyOne: false, overridden: false };
  }

  function mergeDefaults(saved) {
    var byId = {};
    (saved || []).forEach(function (it) { byId[it.id] = it; });
    var merged = [];
    DEFAULT_ITEMS.forEach(function (def) {
      var old = byId[def.id];
      if (!old) {
        merged.push(deepClone([def])[0]);
        return;
      }
      var next = {
        id: def.id,
        section: def.section,
        name: def.name,
        vendor: def.vendor,
        price: def.price != null ? def.price : null,
        unit: old.unit || def.unit,
        note: def.note || old.note
      };
      // Always refresh prices from defaults (source of truth for multi-vendor)
      if (def.prices) next.prices = deepClone([def.prices])[0];
      else delete next.prices; // ensure removed prices stay removed
      // Keep custom unit tweaks only; vendor/price always from latest defaults
      if (next.prices && next.prices[next.vendor] != null) {
        next.price = next.prices[next.vendor];
      }
      merged.push(next);
      delete byId[def.id];
    });
    // keep custom items
    Object.keys(byId).forEach(function (id) {
      if (id.indexOf('custom_') === 0 || !DEFAULT_ITEMS.some(function (d) { return d.id === id; })) {
        merged.push(byId[id]);
      }
    });
    return merged;
  }

  function load() {
    try {
      var savedItems = localStorage.getItem(STORAGE_ITEMS);
      if (!savedItems) {
        var old = localStorage.getItem(STORAGE_ITEMS_OLD) || localStorage.getItem('applechicken_items_v1');
        if (old) {
          items = mergeDefaults(JSON.parse(old));
          saveItems();
        } else {
          items = deepClone(DEFAULT_ITEMS);
        }
      } else {
        items = mergeDefaults(JSON.parse(savedItems));
        saveItems();
      }
    } catch (e) {
      items = deepClone(DEFAULT_ITEMS);
    }
    try {
      var savedQty = localStorage.getItem(STORAGE_QTY);
      qty = savedQty ? JSON.parse(savedQty) : {};
    } catch (e) {
      qty = {};
    }
    try {
      var savedMode = localStorage.getItem(STORAGE_MODE);
      if (savedMode === 'cheapest' || savedMode === 'second') mode = savedMode;
      else mode = 'cheapest'; // also maps old 'default'/'預設' to 最便宜
    } catch (e) {
      mode = 'default';
    }
    try {
      var savedOv = localStorage.getItem(STORAGE_OVERRIDES) || localStorage.getItem('applechicken_overrides_v1');
      overrides = savedOv ? JSON.parse(savedOv) : {};
      if (!overrides || typeof overrides !== 'object') overrides = {};
    } catch (e) {
      overrides = {};
    }
    // Drop overrides pointing at vendors the item no longer carries / invalid
    var ovChanged = false;
    Object.keys(overrides).forEach(function (id) {
      var it = items.find(function (x) { return x.id === id; });
      var v = overrides[id];
      if (!it || !v) { delete overrides[id]; ovChanged = true; return; }
      if (hasPrices(it)) {
        if (it.prices[v] == null) { delete overrides[id]; ovChanged = true; }
      } else if (v !== it.vendor) {
        delete overrides[id]; ovChanged = true;
      }
    });
    if (ovChanged) saveOverrides();
  }

  function saveItems() {
    localStorage.setItem(STORAGE_ITEMS, JSON.stringify(items));
  }
  function saveQty() {
    localStorage.setItem(STORAGE_QTY, JSON.stringify(qty));
  }
  function saveMode() {
    localStorage.setItem(STORAGE_MODE, mode);
  }
  function saveOverrides() {
    localStorage.setItem(STORAGE_OVERRIDES, JSON.stringify(overrides));
  }

  function getQty(id) {
    var n = qty[id];
    return typeof n === 'number' && n > 0 ? n : 0;
  }

  function formatPrice(p) {
    if (p === null || p === undefined || p === '' || isNaN(p)) return '—';
    return '$' + Number(p);
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function todayStr() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '/' + m + '/' + day;
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  function vendorOptionsHtml(selected) {
    return VENDORS.map(function (v) {
      return '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
  }

  function updateModeButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('.mode-btn'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
    });
  }

  window.setMode = function (m) {
    if (m !== 'cheapest' && m !== 'second') return;
    mode = m;
    saveMode();
    updateModeButtons();
    render();
    // if settle open, refresh it
    if (document.getElementById('settleModal').classList.contains('open')) {
      openSettle();
    }
  };

  function render() {
    updateModeButtons();
    var root = document.getElementById('listRoot');
    var html = '';
    SECTIONS.forEach(function (sec) {
      var list = items.filter(function (it) { return it.section === sec; });
      if (!list.length && !settingsOn) return;
      var selectedCount = list.reduce(function (a, it) { return a + (getQty(it.id) > 0 ? 1 : 0); }, 0);
      html += '<section class="section" data-section="' + escapeHtml(sec) + '">';
      html += '<div class="section-head"><span>' + escapeHtml(sec) + '</span>';
      if (selectedCount > 0) html += '<span class="count">' + selectedCount + '</span>';
      html += '</div>';

      list.forEach(function (it) {
        var q = getQty(it.id);
        var has = q > 0;
        var resolved = resolveVendor(it);
        var tagClass = 'tag tappable vendor-' + escapeHtml(resolved.vendor) + (resolved.overridden ? ' has-override' : '');
        html += '<div class="item' + (has ? ' has-qty' : '') + '" data-id="' + escapeHtml(it.id) + '">';
        html += '<div class="item-info">';
        html += '<div class="item-name">' + escapeHtml(it.name) + (it.note ? ' <span style="font-size:14px;color:#888;font-weight:500">(' + escapeHtml(it.note) + ')</span>' : '') + '</div>';
        html += '<div class="item-meta">';
        html += '<span class="' + tagClass + '" onclick="openVendorPicker(\'' + it.id + '\')">' + escapeHtml(resolved.vendor) + '</span>';
        html += '<span class="price">' + formatPrice(resolved.price) + (resolved.price != null ? '/' + escapeHtml(it.unit || '包') : (it.section === '蔬菜類' ? ' · 時價' : '')) + '</span>';
        if (resolved.onlyOne && mode === 'second' && !resolved.overridden) {
          html += '<span class="only-one">只有一家</span>';
        }
        if (resolved.overridden) {
          html += '<span class="only-one" style="background:#e3f2fd;color:#1565c0">已指定</span>';
        }
        html += '</div>';
        html += '<div class="settings-row">';
        html += '<select onchange="updateVendor(\'' + it.id + '\', this.value)">' + vendorOptionsHtml(it.vendor) + '</select>';
        html += '<input class="price-input" type="number" min="0" step="1" placeholder="單價" value="' + (it.price != null ? it.price : '') + '" onchange="updatePrice(\'' + it.id + '\', this.value)">';
        html += '<button type="button" class="btn-del" onclick="deleteItem(\'' + it.id + '\')">刪除</button>';
        html += '</div>';
        html += '</div>';
        html += '<div class="qty-ctrl">';
        html += '<button type="button" class="qty-btn minus" ' + (q <= 0 ? 'disabled' : '') + ' onclick="changeQty(\'' + it.id + '\', -1)">−</button>';
        html += '<div><div class="qty-val' + (q === 0 ? ' zero' : '') + '">' + q + '</div>';
        if (it.unit && it.unit !== '包') html += '<div class="unit-label">' + escapeHtml(it.unit) + '</div>';
        html += '</div>';
        html += '<button type="button" class="qty-btn plus" onclick="changeQty(\'' + it.id + '\', 1)">＋</button>';
        html += '</div>';
        html += '</div>';
      });

      html += '<div class="add-item-row">';
      html += '<input class="name" type="text" placeholder="新品項名稱" id="addName_' + escapeHtml(sec) + '">';
      html += '<select id="addVendor_' + escapeHtml(sec) + '">' + vendorOptionsHtml(sec === '蔬菜類' ? '菜商' : '未指定') + '</select>';
      html += '<input class="price" type="number" min="0" placeholder="單價" id="addPrice_' + escapeHtml(sec) + '">';
      html += '<button type="button" class="btn-add" onclick="addItem(\'' + escapeHtml(sec) + '\')">新增</button>';
      html += '</div>';

      html += '</section>';
    });
    root.innerHTML = html;
    updateBottom();
  }

  function updateBottom() {
    var itemCount = 0;
    var packCount = 0;
    items.forEach(function (it) {
      var q = getQty(it.id);
      if (q > 0) { itemCount++; packCount += q; }
    });
    document.getElementById('totalCount').textContent = itemCount + ' 項 · ' + packCount + ' 包';
    document.getElementById('btnSettle').disabled = itemCount === 0;
  }

  window.changeQty = function (id, delta) {
    var q = getQty(id) + delta;
    if (q < 0) q = 0;
    if (q > 999) q = 999;
    if (q === 0) delete qty[id];
    else qty[id] = q;
    saveQty();
    var row = document.querySelector('.item[data-id="' + id + '"]');
    if (row) {
      row.classList.toggle('has-qty', q > 0);
      var val = row.querySelector('.qty-val');
      if (val) {
        val.textContent = q;
        val.classList.toggle('zero', q === 0);
      }
      var minus = row.querySelector('.qty-btn.minus');
      if (minus) minus.disabled = q <= 0;
      var section = row.closest('.section');
      if (section) {
        var secName = section.getAttribute('data-section');
        var list = items.filter(function (it) { return it.section === secName; });
        var selectedCount = list.reduce(function (a, it) { return a + (getQty(it.id) > 0 ? 1 : 0); }, 0);
        var head = section.querySelector('.section-head');
        var badge = head.querySelector('.count');
        if (selectedCount > 0) {
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'count';
            head.appendChild(badge);
          }
          badge.textContent = selectedCount;
        } else if (badge) {
          badge.remove();
        }
      }
    }
    updateBottom();
  };

  window.toggleSettings = function () {
    settingsOn = !settingsOn;
    document.body.classList.toggle('settings-on', settingsOn);
    document.getElementById('btnSettings').classList.toggle('active', settingsOn);
    document.getElementById('settingsBanner').classList.toggle('hidden', !settingsOn);
    render();
  };

  window.updateVendor = function (id, vendor) {
    var it = items.find(function (x) { return x.id === id; });
    if (!it) return;
    it.vendor = vendor;
    if (hasPrices(it) && it.prices[vendor] != null) it.price = it.prices[vendor];
    saveItems();
    render();
  };

  window.updatePrice = function (id, val) {
    var it = items.find(function (x) { return x.id === id; });
    if (!it) return;
    if (val === '' || val === null) it.price = null;
    else {
      var n = Number(val);
      it.price = isNaN(n) ? null : n;
    }
    // also update prices map for current default vendor if present
    if (hasPrices(it) && it.vendor && it.price != null) {
      it.prices[it.vendor] = it.price;
    }
    saveItems();
    render();
  };

  window.deleteItem = function (id) {
    var it = items.find(function (x) { return x.id === id; });
    if (!it) return;
    if (!confirm('確定刪除「' + it.name + '」？')) return;
    items = items.filter(function (x) { return x.id !== id; });
    delete qty[id];
    delete overrides[id];
    saveItems();
    saveQty();
    saveOverrides();
    render();
  };

  window.addItem = function (section) {
    var nameEl = document.getElementById('addName_' + section);
    var vendorEl = document.getElementById('addVendor_' + section);
    var priceEl = document.getElementById('addPrice_' + section);
    var name = (nameEl.value || '').trim();
    if (!name) { toast('請輸入品項名稱'); return; }
    var priceVal = priceEl.value;
    var price = priceVal === '' ? null : Number(priceVal);
    if (priceVal !== '' && isNaN(price)) price = null;
    var id = 'custom_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    var unit = (section === '蔬菜類' && name.indexOf('杏鮑菇') >= 0) ? '斤' : '包';
    var vendor = vendorEl.value;
    var item = { id: id, section: section, name: name, vendor: vendor, price: price, unit: unit };
    if (price != null && PRICE_VENDOR_ORDER.indexOf(vendor) >= 0) {
      item.prices = {};
      item.prices[vendor] = price;
    }
    items.push(item);
    saveItems();
    nameEl.value = '';
    priceEl.value = '';
    toast('已新增「' + name + '」');
    render();
  };

  window.resetDefaults = function () {
    if (!confirm('確定恢復預設品項與廠商？叫貨數量與單獨指定也會一併清除。')) return;
    items = deepClone(DEFAULT_ITEMS);
    qty = {};
    overrides = {};
    mode = 'cheapest';
    saveItems();
    saveQty();
    saveOverrides();
    saveMode();
    toast('已恢復預設');
    render();
  };

  window.clearAll = function () {
    var any = Object.keys(qty).some(function (k) { return qty[k] > 0; });
    if (!any) { toast('目前沒有選取'); return; }
    if (!confirm('確定清除全部叫貨數量？')) return;
    qty = {};
    saveQty();
    render();
    toast('已清除');
  };

  window.openVendorPicker = function (id) {
    var it = items.find(function (x) { return x.id === id; });
    if (!it) return;
    pickerItemId = id;
    var sheet = document.getElementById('pickerSheet');
    var resolved = resolveVendor(it);
    var html = '';
    html += '<div class="picker-title">' + escapeHtml(it.name) + '</div>';
    html += '<div class="picker-sub">選擇這次要跟哪家叫（會蓋過目前模式）</div>';

    var opts = priceEntries(it);
    if (!opts.length) {
      // fixed vendor items
      html += '<button type="button" class="picker-opt selected" onclick="applyOverride(\'' + it.id + '\', \'' + escapeHtml(it.vendor) + '\')">';
      html += '<span>' + escapeHtml(it.vendor) + '</span>';
      html += '<span class="p-price">' + (it.section === '蔬菜類' ? '時價' : formatPrice(it.price)) + '</span>';
      html += '</button>';
    } else {
      opts.forEach(function (o) {
        var selected = (overrides[it.id] ? overrides[it.id] === o.vendor : resolved.vendor === o.vendor && !overrides[it.id]);
        // mark selected if currently resolved to this (including override)
        selected = resolved.vendor === o.vendor;
        html += '<button type="button" class="picker-opt' + (overrides[it.id] === o.vendor ? ' selected' : '') + '" onclick="applyOverride(\'' + it.id + '\', \'' + escapeHtml(o.vendor) + '\')">';
        html += '<span>' + escapeHtml(o.vendor) + (selected && !overrides[it.id] ? ' · 目前模式' : '') + '</span>';
        html += '<span class="p-price">$' + o.price + '</span>';
        html += '</button>';
      });
    }

    html += '<button type="button" class="picker-opt follow" onclick="clearOverride(\'' + it.id + '\')">跟隨模式（' + escapeHtml(MODE_LABELS[mode]) + '）</button>';
    html += '<button type="button" class="picker-cancel" onclick="closePicker()">取消</button>';
    sheet.innerHTML = html;
    document.getElementById('pickerOverlay').classList.add('open');
  };

  window.applyOverride = function (id, vendor) {
    overrides[id] = vendor;
    saveOverrides();
    closePicker();
    render();
    if (document.getElementById('settleModal').classList.contains('open')) openSettle();
    toast('已指定「' + vendor + '」');
  };

  window.clearOverride = function (id) {
    delete overrides[id];
    saveOverrides();
    closePicker();
    render();
    if (document.getElementById('settleModal').classList.contains('open')) openSettle();
    toast('已改為跟隨模式');
  };

  window.closePicker = function () {
    document.getElementById('pickerOverlay').classList.remove('open');
    pickerItemId = null;
  };

  window.pickerBackdrop = function (e) {
    if (e.target === document.getElementById('pickerOverlay')) closePicker();
  };

  function buildGroups() {
    var groups = {};
    VENDOR_ORDER.forEach(function (v) { groups[v] = []; });
    items.forEach(function (it) {
      var q = getQty(it.id);
      if (q <= 0) return;
      var r = resolveVendor(it);
      var v = r.vendor || '未指定';
      if (!groups[v]) groups[v] = [];
      groups[v].push({ item: it, qty: q, price: r.price, onlyOne: r.onlyOne, overridden: r.overridden });
    });
    return groups;
  }

  function vendorCopyText(vendor, lines) {
    var text = '蘋果雞永康店 叫貨 ' + todayStr() + '\n【' + vendor + '】\n';
    lines.forEach(function (line) {
      var unit = line.item.unit || '包';
      text += line.item.name + ' x' + line.qty + (unit !== '包' ? unit : '') + '\n';
    });
    return text.trim();
  }

  window.openSettle = function () {
    var groups = buildGroups();
    var body = document.getElementById('settleBody');
    var html = '';
    var grand = 0;
    var any = false;

    html += '<div class="settle-mode-wrap">';
    html += '<div class="mode-label">叫貨模式</div>';
    html += '<div class="mode-switch">';
    html += '<button type="button" class="mode-btn' + (mode === 'cheapest' ? ' active' : '') + '" data-mode="cheapest" onclick="setMode(\'cheapest\')">最便宜</button>';
    html += '<button type="button" class="mode-btn' + (mode === 'second' ? ' active' : '') + '" data-mode="second" onclick="setMode(\'second\')">次便宜</button>';
    html += '</div></div>';

    VENDOR_ORDER.forEach(function (vendor) {
      var lines = groups[vendor] || [];
      if (!lines.length) return;
      any = true;
      var sub = 0;
      var hasPriced = false;
      lines.forEach(function (line) {
        if (line.price != null && !isNaN(line.price)) {
          sub += line.price * line.qty;
          hasPriced = true;
        }
      });
      if (hasPriced) grand += sub;

      html += '<div class="vendor-card">';
      html += '<div class="vendor-head"><h3>' + escapeHtml(vendor) + '</h3>';
      html += '<button type="button" class="btn-copy" data-vendor="' + escapeHtml(vendor) + '">複製</button></div>';
      if (vendor === '未指定') {
        html += '<div class="vendor-hint">請老闆指定廠商</div>';
      }
      lines.forEach(function (line) {
        var unit = line.item.unit || '包';
        var lineSub = (line.price != null && !isNaN(line.price)) ? ('$' + (line.price * line.qty)) : '—';
        var extra = '';
        if (line.onlyOne && mode === 'second' && !line.overridden) extra = ' <span class="only-one">只有一家</span>';
        if (line.overridden) extra = ' <span class="only-one" style="background:#e3f2fd;color:#1565c0">已指定</span>';
        html += '<div class="vendor-line">';
        html += '<span class="l-name">' + escapeHtml(line.item.name) + extra + '</span>';
        html += '<span class="l-qty">x' + line.qty + (unit !== '包' ? unit : '') + '</span>';
        html += '<span class="l-price">' + formatPrice(line.price) + '</span>';
        html += '<span class="l-sub">' + lineSub + '</span>';
        html += '</div>';
      });
      html += '<div class="vendor-total"><span>小計</span><span>' + (hasPriced ? ('$' + sub) : '時價／未定') + '</span></div>';
      html += '</div>';
    });

    if (!any) {
      html += '<div class="empty-hint">尚未選取任何品項</div>';
    } else {
      html = html.replace(
        '<div class="settle-mode-wrap">',
        '<div class="grand-total"><span class="g-label">預估合計（有標價者）· ' + escapeHtml(MODE_LABELS[mode]) + '</span><span class="g-value">$' + grand + '</span></div><div class="settle-mode-wrap">'
      );
    }

    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll('.btn-copy'), function (btn) {
      btn.addEventListener('click', function () {
        var vendor = btn.getAttribute('data-vendor');
        var lines = groups[vendor] || [];
        var text = vendorCopyText(vendor, lines);
        copyText(text, btn);
      });
    });

    document.getElementById('settleModal').classList.add('open');
  };

  function copyText(text, btn) {
    function done() {
      btn.classList.add('copied');
      btn.textContent = '已複製';
      toast('已複製到剪貼簿');
      setTimeout(function () {
        btn.classList.remove('copied');
        btn.textContent = '複製';
      }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        fallbackCopy(text); done();
      });
    } else {
      fallbackCopy(text); done();
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  window.closeSettle = function () {
    document.getElementById('settleModal').classList.remove('open');
  };

  window.backdropClose = function (e) {
    if (e.target === document.getElementById('settleModal')) closeSettle();
  };

  // Demo: #demo prefills 花枝丸/熱狗/小肉豆/韓式魚板/豆包, sets 次便宜, opens settle
  // #demo-list sets 最便宜 and stays on list
  function applyDemo() {
    var hash = location.hash || '';
    if (hash !== '#demo' && hash !== '#demo-list' && hash !== '#demo-settle') return;
    qty = {
      c4: 2,  // 花枝丸
      x7: 3,  // 熱狗
      x2: 2,  // 小肉豆
      n13: 1, // 韓式魚板
      x8: 2   // 豆包
    };
    overrides = {};
    if (hash === '#demo-list') {
      mode = 'cheapest';
    } else {
      mode = 'second';
    }
    saveQty();
    saveMode();
    saveOverrides();
  }

  // init
  load();
  applyDemo();
  render();

  if (location.hash === '#demo' || location.hash === '#demo-settle') {
    openSettle();
  }

  window.__AC = {
    items: function () { return items; },
    qty: function () { return qty; },
    mode: function () { return mode; },
    overrides: function () { return overrides; },
    resolve: function (id) {
      var it = items.find(function (x) { return x.id === id; });
      return resolveVendor(it);
    },
    setMode: window.setMode,
    render: render
  };
})();
</script>
</body>
</html>
